services:
  devops-dashboard:
    image: ghcr.io/itvishal25/devops-project:${IMAGE_TAG:-latest}
    container_name: devops-dashboard-compose
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
