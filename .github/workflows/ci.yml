name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking project files..."
          test -f index.html
          test -f Dockerfile
          test -f compose.yml
          echo "All required files exist."

      - name: Validate HTML
        run: |
          grep -q "<title>DevOps Dashboard</title>" index.html
          echo "HTML validation passed."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t devops-dashboard:ci .

      - name: Scan Docker image with Trivy
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            devops-dashboard:ci

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}

          docker tag devops-dashboard:ci $IMAGE:latest
          docker tag devops-dashboard:ci $IMAGE:${{ github.sha }}

          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Deploy with Docker Compose
        if: github.event_name == 'push'
        run: |
          set -e

          IMAGE=ghcr.io/${{ github.repository }}
          NEW_TAG=${{ github.sha }}

          echo "New image: $IMAGE:$NEW_TAG"

          PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' devops-dashboard-compose 2>/dev/null || true)

          echo "Previous image: ${PREVIOUS_IMAGE:-none}"

          export IMAGE_TAG=$NEW_TAG

          echo "Pulling new image..."
          docker compose pull

          echo "Starting new deployment..."
          docker compose up -d

          echo "Waiting for application..."
          sleep 5

          echo "Running health check..."
          if curl --fail --silent http://localhost:8081 > /dev/null; then
            echo "Health check passed."
            echo "Deployment successful: $IMAGE:$NEW_TAG"
          else
            echo "Health check FAILED."
            echo "Starting rollback..."

            if [ -n "$PREVIOUS_IMAGE" ]; then
               echo "Rolling back to: $PREVIOUS_IMAGE"

               export IMAGE_TAG="${PREVIOUS_IMAGE##*:}"

               docker compose pull
               docker compose up -d

              if curl --fail --silent http://localhost:8081 > /dev/null; then
                echo "Rollback successful."
              else
                echo "Rollback FAILED."
                exit 1
              fi
            else
              echo "No previous deployment found."
              exit 1
            fi
          fi
