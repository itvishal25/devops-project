name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking project files..."
          test -f index.html
          test -f Dockerfile
          echo "All required files exist."

      - name: Validate HTML
        run: |
          grep -q "<title>DevOps Dashboard</title>" index.html
          echo "HTML validation passed."
