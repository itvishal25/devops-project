name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: self-hosted 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking project files..."
          test -f index.html
          test -f Dockerfile
          echo "All required files exist."

      - name: Validate HTML
        run: |
          grep -q "<title>DevOps Dashboard</title>" index.html
          echo "HTML validation passed."
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: docker build -t devops-dashboard:ci .

      - name: Scan Docker image with Trivy
        run: |
          trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed devops-dashboard:ci

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker tag devops-dashboard:ci $IMAGE:latest
          docker tag devops-dashboard:ci $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
      - name: Deploy to local server
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          TAG=${{ github.sha }}

          echo "Pulling image: $IMAGE:$TAG"
          docker pull $IMAGE:$TAG

          echo "Stopping old container..."
          docker rm -f devops-dashboard 2>/dev/null || true

          echo "Starting new container..."
          docker run -d \
            --name devops-dashboard \
            -p 8080:80 \
            $IMAGE:$TAG

          echo "Deployment completed."
